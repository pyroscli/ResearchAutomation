[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbot"
version = "0.1.0"
description = "Telegram research intelligence bot orchestrated around Cursor Cloud Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "cursor-sdk>=1.0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
researchbot = "researchbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
